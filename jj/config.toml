[user]
name = "Nick Gerace"
email = "nickagerace@gmail.com"

[ui]
editor = "hx"
diff-formatter = "difft"

[merge-tools.difft]
diff-args = ["--color=always", "--display=side-by-side", "--width=$width", "--sort-paths", "$left", "$right"]

[revset-aliases]
"active()" = "mine() & mutable()"
"trunk_working_copies()" = "working_copies() & mutable() & children(::trunk())"

[aliases]
a = ["abandon"]
active = ["log", "-r", "active()"]
bl = ["bookmark", "list", "-T", """
if(!remote && normal_target && !normal_target.contained_in("trunk()"),
  name ++ " --> " ++ normal_target.change_id().shortest() ++ " --> " ++
  normal_target.description().first_line() ++ "\\n"
)
"""]
push-active = ["git", "push", "-r", "active() & ~conflicts() & ~divergent()"]
rebase-all = ["rebase", "-b", "active() | trunk_working_copies()", "-o", "trunk()"]
stack = ["log", "-r", "@ | trunk()..@ | trunk()"]

[templates]
git_push_bookmark = '''
"ng/" ++ change_id.short().substr(0, 3)
'''
