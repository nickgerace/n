[user]
name = "Nick Gerace"
email = "nickagerace@gmail.com"

[ui]
editor = "hx"
diff-formatter = "difft"

[merge-tools.difft]
diff-args = ["--color=always", "--display=side-by-side", "--width=$width", "--sort-paths", "$left", "$right"]

[aliases]
stack = ["log", "-r", "@ | trunk()..@ | trunk()"]

[templates]
git_push_bookmark = '''
"ng/" ++ change_id.short().substr(0, 3)
'''
